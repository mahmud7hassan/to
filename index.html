<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d3e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>My Notes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--ink:#14202b;--bg:#e9eef1;--side:#0f3d3e;--side2:#164c4d;--line:#d5e0e8;--acc:#0f766e;--surf:#fff;--mute:#5b6b79;--onacc:#fff;--r:10px}
:root[data-theme=dark]{--ink:#e6edf3;--bg:#0d1117;--side:#010409;--side2:#161b22;--line:#30363d;--acc:#2dd4bf;--surf:#161b22;--mute:#8b949e;--onacc:#04201d}
:root[data-theme=midnight]{--ink:#e2e8f0;--bg:#0f172a;--side:#020617;--side2:#1e293b;--line:#334155;--acc:#60a5fa;--surf:#1e293b;--mute:#94a3b8;--onacc:#0b1b33}
:root[data-theme=ocean]{--ink:#0f2740;--bg:#e6f0fa;--side:#0b3a6b;--side2:#12508f;--line:#c9dcef;--acc:#1d6fd1;--mute:#51657a}
:root[data-theme=forest]{--ink:#18261b;--bg:#e8f0e6;--side:#1f4d2e;--side2:#2a6340;--line:#d3e0d0;--acc:#2f8f4e;--mute:#546657}
:root[data-theme=rose]{--ink:#3a1624;--bg:#f8e9ee;--side:#7a1f45;--side2:#932a58;--line:#efd3dc;--acc:#c2255c;--mute:#7d5565}
:root[data-theme=purple]{--ink:#241538;--bg:#efe9f8;--side:#3b1d6b;--side2:#4c2a85;--line:#ddd0f0;--acc:#7c3aed;--mute:#665a7d}
:root[data-theme=amber]{--ink:#2e1d0b;--bg:#f6ecdc;--side:#6b3a0f;--side2:#85490f;--line:#e8d8bd;--acc:#b45309;--mute:#7a6650}
:root[data-theme=mono]{--ink:#1a1a1a;--bg:#ececec;--side:#222;--side2:#353535;--line:#d6d6d6;--acc:#444;--mute:#666}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{height:100vh;height:100dvh}
body{font-family:system-ui,"Noto Sans Bengali","Segoe UI",sans-serif;color:var(--ink);background:var(--bgi,var(--bg));display:flex;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button,select{cursor:pointer;border:1px solid var(--line);background:var(--surf);border-radius:var(--r);padding:6px 11px;min-height:38px}
button:hover,select:hover{border-color:var(--acc)}
:focus-visible{outline:3px solid #5eead4;outline-offset:1px}
button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
button:disabled{opacity:.4;cursor:default}
aside{width:280px;flex:none;background:var(--side);color:#e6f2f1;display:flex;flex-direction:column;padding:12px;gap:8px;padding-top:max(12px,env(safe-area-inset-top))}
aside h1{font-size:20px;margin:4px 4px 0}
aside input[type=search]{width:100%;padding:10px 12px;border-radius:var(--r);border:0;background:var(--side2);color:#fff}
aside input::placeholder{color:#9cc2c0}
aside button{background:var(--side2);border-color:var(--side2);color:#e6f2f1}
aside .new{background:var(--newbg,#5eead4);border:0;color:var(--newfg,#052e2b);font-weight:600}
.row{display:flex;gap:6px}.row button{flex:1;font-size:14px}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
#list li{padding:9px 12px;border-radius:var(--r);cursor:pointer}
#list li:hover{background:var(--side2)}
#list li.cur{background:var(--surf);color:var(--ink)}
#list b,#list small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list small{opacity:.7}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--surf);border-bottom:1px solid var(--line)}
.g{display:flex;gap:4px;align-items:center}
.sp{flex:1}
.sw{width:28px;height:28px;min-height:0;padding:0;border-radius:50%;border:3px solid var(--surf);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--acc)}
#menu{display:none}
#scroll{flex:1;overflow:auto;padding:0 12px 60px}
#title{width:min(100%,900px);margin:12px auto 0;display:block;font-size:24px;font-weight:600;border:0;background:transparent;padding:6px 16px}
.page{container-type:inline-size;width:min(100%,900px);margin:8px auto 0}
.plabel{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin:14px 2px 4px}
.plabel button{min-height:28px;padding:2px 8px;font-size:12px}
.sheet{position:relative;width:100%;background-color:#fff;border-radius:6px;box-shadow:0 2px 14px rgba(15,61,62,.18);overflow:hidden;background-size:calc(100cqw/28.125) calc(100cqw/28.125)}
.sheet.grid{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px)}
.sheet.lined{background-image:linear-gradient(var(--line) 1px,transparent 1px)}
.sheet.blank,.sheet.bg{background-image:none}
.sheet textarea{position:absolute;inset:0;width:100%;height:100%;border:0;resize:none;background:transparent;font-size:calc(100cqw/45);line-height:calc(100cqw/28.125);padding:0 calc(100cqw/32);outline:none;overflow:hidden}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none}
.drawing .sheet canvas{pointer-events:auto;cursor:crosshair}
.drawing .sheet textarea{pointer-events:none}
body.writing .dtools,body.writing #etools{visibility:hidden}body.writing #colorPop,body.writing #shapePop{display:none!important}
.drawing.t-select .sheet canvas{cursor:default}
.drawing.t-er .sheet canvas{cursor:none}
#erCur{position:fixed;z-index:30;pointer-events:none;display:none;align-items:center;justify-content:center;border:2px dashed #0f766e;border-radius:50%;background:rgba(255,255,255,.4);box-shadow:0 0 0 1px rgba(255,255,255,.7);color:#0f766e;transform:translate(-50%,-50%)}
.dtools{display:none}.drawing .dtools{display:flex}
input[type=range]{width:110px;accent-color:var(--acc);min-height:30px}.val{min-width:24px;font-size:13px;color:var(--mute)}
#colors{flex-wrap:wrap;max-width:340px}
#cust{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
button svg{display:block}
#shapePop{position:fixed;z-index:20;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.25);display:none;flex-direction:column;gap:6px}
#shapePop .sg{display:flex;flex-wrap:wrap;gap:4px;max-width:200px}
#shapePop .sg+.sg{border-top:1px solid var(--line);padding-top:6px}.ib{padding:7px 9px}
.sheet textarea.tbx{inset:auto;border:1.5px dashed var(--acc);background:transparent;z-index:3;overflow:hidden;font-family:system-ui,"Noto Sans Bengali",sans-serif}
.drawing .sheet textarea.tbx{pointer-events:auto}
.fsonly{display:none}
body.fs .fsonly{display:inline-block}
body.fs aside,body.fs #title,body.fs .plabel,body.fs #menu,body.fs #delNote{display:none}
body.fs #scroll{padding:0;scroll-snap-type:y mandatory;overscroll-behavior:contain}
body.fs .page{margin:0 auto;scroll-snap-align:center;scroll-snap-stop:always;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center}
body.fs .sheet{border-radius:0;box-shadow:none}
body.fs .bar button,body.fs .bar select{min-height:46px}
#morePop{position:fixed;z-index:20;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.25);display:none;flex-direction:column;gap:8px;min-width:190px}
body.writing #morePop{display:none!important}
#pgNo{min-width:44px;text-align:center;align-self:center}
#colorPop{position:fixed;z-index:20;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.25);display:none;gap:8px;align-items:center;max-width:390px}
aside select{background:var(--side2);border-color:var(--side2);color:#e6f2f1}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#14202b;color:#fff;padding:10px 16px;border-radius:var(--r);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (max-width:760px){
  #menu{display:inline-block}
  aside{position:fixed;z-index:5;inset:0 auto 0 0;width:min(86vw,320px);transform:translateX(-102%);transition:transform .2s}
  aside.open{transform:none}
  #title{font-size:20px}
}
@media (prefers-reduced-motion:reduce){aside,#toast{transition:none}}

/* ===== bottom toolbar ===== */
.bar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100vw - 16px);bottom:max(12px,env(safe-area-inset-bottom));z-index:15;padding:6px;gap:4px;justify-content:center;background:#1b1d23;border:1px solid #2c2f37;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.4);color:#e8eaee}
.bar>*{order:20}.sp,.fsonly{display:none}
#tools{display:contents}
.bar [data-tool=select]{order:1}.bar [data-tool=pen]{order:2}.bar [data-tool=hl]{order:3}.bar [data-tool=er]{order:4}#shapeBtn{order:5}.bar [data-tool=tbox]{order:6}#addImg{order:7}.bar [data-tool=type]{order:8}
#undo{order:10;margin-left:8px}#redo{order:11}#delSel{order:12}#moreBtn{order:13}
.bar button{background:transparent;border:0;color:#cfd3da;min-height:40px;min-width:40px;border-radius:10px;padding:6px}
.bar button:hover{background:#2a2d36}.bar button.on{background:#d4ff3a;color:#101114}.bar button:disabled{opacity:.35}
.bar #menu{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;z-index:16;order:0;background:#1b1d23;border:1px solid #2c2f37;color:#e8eaee;padding:6px 12px}
#dtools,#stools,#etools{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1b1d23;border:1px solid #2c2f37;border-radius:14px;padding:6px 10px;color:#e8eaee;white-space:nowrap;box-shadow:0 8px 28px rgba(0,0,0,.4)}
#etools select{background:#262932;color:#e8eaee;border-color:#343843}
#scroll{padding-bottom:160px}#toast{bottom:90px;z-index:30}
.page{width:calc(min(100%,900px)*var(--z,1))}
/* ===== page nav (bottom right) ===== */
#pnav{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:15;display:flex;align-items:center;gap:2px;background:#1b1d23;border:1px solid #2c2f37;border-radius:14px;padding:5px;color:#e8eaee}
#pnav button{background:transparent;border:0;color:#cfd3da;min-height:36px;min-width:34px;padding:4px 6px;border-radius:10px}
#pnav .fsonly{display:inline-block}#pnav #addPage{background:#d4ff3a;color:#101114}
#pnav .val{color:#e8eaee;font-size:13px;min-width:44px}
@media(max-width:1340px){#pnav{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 64px)}}
@media(max-width:600px){#pnav{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 112px)}#scroll{padding-top:46px}}
/* ===== popups (dark) ===== */
#morePop,#colorPop{background:#1b1d23;color:#e8eaee;border-color:#2c2f37}
#morePop select,#morePop button{background:#262932;color:#e8eaee;border-color:#343843}
#morePop button{display:flex;gap:8px;align-items:center}
#shapePop{background:#1b1d23;border:1px solid #2c2f37;color:#aeb4bf;padding:12px;width:min(560px,calc(100vw - 16px));max-height:min(62vh,520px);overflow:auto;gap:6px}
#shapePop h4{margin:8px 0 2px;font-size:12px;letter-spacing:.08em;font-weight:600;color:#9aa0ab}
#shapePop .sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;max-width:none}
#shapePop .sg+.sg{border:0;padding:0}
#shapePop .st{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;background:#232630;border:1px solid #30343e;color:#aeb4bf;font-size:11px;line-height:1.1;text-align:center}
#shapePop .st.on{border-color:#d4ff3a;color:#fff}
/* ===== selection toolbar ===== */
#ctx{position:fixed;z-index:18;display:none;flex-direction:column;gap:6px;padding:8px 10px;background:#1b1d23;border:1px solid #2c2f37;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.4);transform:translateX(-50%);color:#cfd3da}
#ctx .cr{display:flex;gap:8px;justify-content:center;align-items:center}
#ctx button{background:transparent;border:0;color:#cfd3da;min-height:34px;min-width:34px;padding:4px;border-radius:8px}
#ctx button:hover{background:#2a2d36}
#ctx .cd{width:26px;height:26px;min-height:0;min-width:0;border-radius:50%;border:2px solid #1b1d23;box-shadow:0 0 0 1px #4a4f5c;padding:0}
#pnav #pgNo{font-weight:600;padding:4px 8px;min-width:68px}#pnav #pgNo:hover{background:#2a2d36}
.page{scroll-margin-top:56px}
#jumpPop{position:fixed;z-index:25;right:10px;width:min(340px,calc(100vw - 20px));background:#1b1d23;color:#e8eaee;border:1px solid #2c2f37;border-radius:14px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.4);display:none;flex-direction:column;gap:8px;max-height:72vh}
#jumpPop .jr{display:flex;gap:6px;align-items:center}
#jumpPop .jr button{flex:1}
#jumpPop button{background:#262932;color:#e8eaee;border:1px solid #343843;min-height:38px;border-radius:10px;padding:4px 8px}
#jumpPop button:hover{border-color:#d4ff3a}
#jumpPop #jGo{flex:none;background:#d4ff3a;color:#101114;border-color:#d4ff3a;font-weight:600;padding:4px 16px}
#jumpPop input[type=number]{flex:1;min-width:0;background:#262932;color:#e8eaee;border:1px solid #343843;border-radius:10px;padding:8px 10px;font-size:16px}
#jumpPop #jTot{color:#9aa0ab;font-size:14px}
#jumpPop #jRange{width:100%;margin:2px 0;accent-color:#d4ff3a}
#jGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px;overflow:auto;min-height:0;padding:2px}
#jGrid button{min-height:36px;padding:2px;font-size:13px}
#jGrid button.has{border-color:#4f8a80}
#jGrid button.cur{background:#d4ff3a;color:#101114;border-color:#d4ff3a;font-weight:600}
/* ===== slide thumbnails rail ===== */
#thumbs{display:none;flex:none;width:158px;background:#4a4a4a;border-right:1px solid #2e2e2e;overflow-y:auto;overflow-x:hidden;padding:10px 8px 96px 6px;padding-top:max(10px,env(safe-area-inset-top));overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
body.th-on #thumbs{display:block}
#thList{display:flex;flex-direction:column;gap:12px}
.th{display:flex;gap:6px;align-items:flex-start;cursor:pointer;padding:3px 2px}
.th .tn{width:20px;flex:none;text-align:right;color:#eceff3;font-size:14px;padding-top:2px}
.th canvas{display:block;flex:none;background:#fff;border:1px solid #9a9a9a}
.th.cur canvas{outline:3px solid #e7826b;outline-offset:0}
.th.cur .tn{font-weight:700}
#thAdd{min-height:40px;border:1px dashed #8a8a8a;background:transparent;color:#eceff3;border-radius:6px;font-size:22px;line-height:1;margin-left:26px}
body.fs #thumbs{padding-top:10px}
#pnav button.on{background:#d4ff3a;color:#101114}
@media(max-width:760px){#thumbs{width:104px;padding-top:52px}body.fs #thumbs{padding-top:10px}}

/* ===== v3 additions ===== */
.bar [data-tool=type]{display:none!important}
#dupPage{order:8}
#barGrip,#pnGrip{order:0;width:24px;min-height:40px;display:flex;align-items:center;justify-content:center;color:#7d8491;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:8px}
#barGrip:hover,#pnGrip:hover{background:#2a2d36;color:#cfd3da}
.bar.moving,#pnav.moving{cursor:grabbing;box-shadow:0 12px 36px rgba(0,0,0,.55)}.bar.moving #barGrip,#pnav.moving #pnGrip{cursor:grabbing;color:#d4ff3a}
.bar.top #dtools,.bar.top #stools,.bar.top #etools{bottom:auto;top:calc(100% + 8px)}
#straightBtn{display:flex;gap:6px;align-items:center;font-size:13px;padding:6px 10px}
.nin{width:56px;min-height:34px;background:#262932;color:#e8eaee;border:1px solid #343843;border-radius:8px;padding:4px 6px;font-size:15px;text-align:center}
.stp{gap:2px}.stp .stl{font-size:12px;color:#9aa0ab;margin:0 2px 0 6px}
.stp button{min-width:32px;min-height:34px;padding:4px}

/* ===== timer ===== */
#tmBtn.on{background:#d4ff3a;color:#101114}
#timerPop{position:fixed;z-index:26;width:min(320px,calc(100vw - 20px));background:#1b1d23;color:#e8eaee;border:1px solid #2c2f37;border-radius:14px;padding:12px;box-shadow:0 8px 28px rgba(0,0,0,.4);display:none;flex-direction:column;gap:10px}
#timerPop .tmh{font-weight:700;font-size:15px}
#timerPop .tmg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#timerPop .tmc{display:flex;gap:6px;align-items:center}
#timerPop button{background:#262932;color:#e8eaee;border:1px solid #343843;min-height:40px;border-radius:10px;padding:4px 10px}
#timerPop button:hover{border-color:#d4ff3a}
#timerPop input{width:0;flex:1;min-width:0;background:#262932;color:#e8eaee;border:1px solid #343843;border-radius:10px;padding:8px;font-size:16px;text-align:center}
#timerPop .tmu{color:#9aa0ab;font-size:13px}
#timerPop #tmGo{flex:none;background:#d4ff3a;color:#101114;border-color:#d4ff3a;font-weight:700;padding:4px 16px}
#tmShow{position:fixed;left:0;right:0;margin:0 auto;top:52px;width:max-content;max-width:calc(100vw - 12px);z-index:18;display:none;align-items:center;gap:6px;background:#1b1d23;color:#e8eaee;border:1px solid #2c2f37;border-radius:16px;padding:6px 8px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
#tmShow.on{display:flex}
#tmShow button{background:#262932;color:#e8eaee;border:1px solid #343843;min-height:38px;border-radius:10px;padding:4px 10px;font-size:13px}
#tmShow button:hover{border-color:#d4ff3a}
#tmTime{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px;padding:0 6px;min-width:96px;text-align:center}
#tmShow.warn #tmTime{color:#ffcc00}
#tmShow.done{background:#c62828;border-color:#ff8a80;animation:tmflash .7s infinite alternate}
#tmShow.done #tmTime{font-size:26px;color:#fff}
@keyframes tmflash{from{background:#c62828}to{background:#ef5350}}
@media (prefers-reduced-motion:reduce){#tmShow.done{animation:none}}
#tmGrip{width:22px;min-height:40px;display:flex;align-items:center;justify-content:center;color:#7d8491;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:8px}
#tmShow.moving{box-shadow:0 12px 36px rgba(0,0,0,.6)}#tmShow.moving #tmGrip{cursor:grabbing;color:#d4ff3a}

/* timer size (em-based, scaled by --tz) */
#tmShow{font-size:calc(14px*var(--tz,1));gap:.45em;padding:.45em .55em;border-radius:1.1em;flex-wrap:wrap;justify-content:center}
#tmShow button{min-height:2.7em;font-size:.93em;padding:.3em .75em;border-radius:.75em}
#tmTime{font-size:2.43em;min-width:3em;padding:0 .2em}
#tmShow.done #tmTime{font-size:1.85em}
#tmGrip{width:1.6em;min-height:2.8em}#tmGrip svg{width:1.3em;height:1.3em}
#tmShow .tmsz{min-width:2.4em;padding:.3em .4em;font-weight:700}
#timerPop .tmsz{flex:1;font-weight:700}

/* ===== periodic table ===== */
#ptOv{position:fixed;inset:0;z-index:40;background:#12141a;color:#e8eaee;display:none;flex-direction:column}
#ptOv.on{display:flex}
#ptOv .ptTop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid #2c2f37}
#ptOv .ptTop h3{margin:0;font-size:16px;flex:none}
#ptOv input[type=search]{flex:1;min-width:130px;background:#262932;color:#e8eaee;border:1px solid #343843;border-radius:10px;padding:8px 10px;font-size:16px}
#ptOv .ptTop select,#ptOv .ptTop button{background:#262932;color:#e8eaee;border:1px solid #343843;border-radius:10px;min-height:38px;padding:4px 10px;font-size:14px}
#ptOv .ptTop button:hover{border-color:#d4ff3a}
#ptOv .ptTop .go{background:#d4ff3a;color:#101114;border-color:#d4ff3a;font-weight:700}

var st;function save(n){n=n||cur;if(!n)return;n.updated=Date.now();clearTimeout(st);st=setTimeout(function(){dbPut(n)},300);renderList()}

/* ---------- geometry ---------- */
function bbox(o){
  if(o.t==="i"||o.t==="x")return[o.x,o.y,o.x+o.w,o.y+o.h];
  if(o.t==="h"){var X0=1e9,Y0=1e9,X1=-1e9,Y1=-1e9;geom(o).forEach(function(g){g.p.forEach(function(q){X0=Math.min(X0,q[0]);Y0=Math.min(Y0,q[1]);X1=Math.max(X1,q[0]);Y1=Math.max(Y1,q[1])})});return[X0-o.w,Y0-o.w,X1+o.w,Y1+o.w]}
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,m2=o.hl?o.w*2:o.w;

  if(o.t==="s"){var r=tol+(o.hl?o.w*2:o.w/2+1);if(o.p.length===1)return Math.hypot(x-o.p[0][0],y-o.p[0][1])<r;
    for(var i=1;i<o.p.length;i++)if(dseg(x,y,o.p[i-1][0],o.p[i-1][1],o.p[i][0],o.p[i][1])<r)return true;return false}
  var t=tol+o.w,gs=geom(o);for(var a=0;a<gs.length;a++){var pp=gs[a].p;for(var j=1;j<pp.length;j++)if(dseg(x,y,pp[j-1][0],pp[j-1][1],pp[j][0],pp[j][1])<t)return true}return false}

  if(o.t==="s")n.p=o.p.map(function(q){var r=f(q[0],q[1]);return[r[0],r[1],q[2]]});
  else if(o.t==="h"){var a=f(o.x1,o.y1),b=f(o.x2,o.y2);n.x1=a[0];n.y1=a[1];n.x2=b[0];n.y2=b[1]}
  else{var a2=f(o.x,o.y),b2=f(o.x+o.w,o.y+o.h);n.x=a2[0];n.y=a2[1];n.w=b2[0]-a2[0];n.h=b2[1]-a2[1]}

function aabb(o){var b=bbox(o);if(!o.r)return b;var cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2,c=Math.cos(o.r),s=Math.sin(o.r),X0=1e9,Y0=1e9,X1=-1e9,Y1=-1e9;

function frameOf(pg,ids){if(ids.length===1){var o=pg.objs[ids[0]],b=bbox(o);return{cx:(b[0]+b[2])/2,cy:(b[1]+b[3])/2,hw:(b[2]-b[0])/2,hh:(b[3]-b[1])/2,r:o.r||0}}
